site_name: Source Query Proxy
site_description: High-performance proxy for Source Engine game servers using eBPF packet redirection
site_author: sqproxy
site_url: https://github.com/sqproxy/sqproxy

repo_name: sqproxy/sqproxy
repo_url: https://github.com/sqproxy/sqproxy
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - autorefs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Configuration: configuration.md
    - Quick Start: quickstart.md
  - eBPF Integration:
    - Overview: ebpf/overview.md
    - Setup Guide: ebpf/setup.md
    - Architecture: ebpf/architecture.md
    - Performance: ebpf/performance.md
  - Migration:
    - From v2.x to v3.0: migration.md
    - Troubleshooting: troubleshooting.md
  - Advanced:
    - API Reference: api-reference.md
    - Development Guide: development.md
    - Docker Deployment: docker.md
  - About:
    - Changelog: changelog.md
    - Contributing: contributing.md
    - License: license.md

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sqproxy/sqproxy
